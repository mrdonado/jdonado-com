customHeaders:
  - pattern: '**'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'
          https://www.googletagmanager.com; style-src 'self' 'unsafe-inline';
          img-src 'self' https://www.googletagmanager.com data: https:; font-src
          'self' data:; object-src 'none'; connect-src 'self'
          https://*.google-analytics.com; child-src 'none'; frame-src 'self'
          https://www.youtube.com https://www.googletagmanager.com;
          upgrade-insecure-requests; manifest-src 'self';"
      - key: X-Frame-Options
        value: SAMEORIGIN
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: geolocation=(), microphone=(), camera=()
      # HTML, robots.txt and llms.txt must be refreshed after a deployment.
      - key: Cache-Control
        value: public, max-age=0, must-revalidate
  # Public assets use stable URLs and may change between deployments.
  - pattern: '**/*.js'
    headers:
      - key: Cache-Control
        value: public, max-age=86400
  - pattern: '**/*.css'
    headers:
      - key: Cache-Control
        value: public, max-age=86400
  - pattern: '**/*.ttf'
    headers:
      - key: Cache-Control
        value: public, max-age=86400
  - pattern: '**/*.woff2'
    headers:
      - key: Cache-Control
        value: public, max-age=86400
  - pattern: '**/*.(png|jpg|jpeg|svg|gif|webp)'
    headers:
      - key: Cache-Control
        value: public, max-age=2592000
  - pattern: '**/*.json'
    headers:
      - key: Cache-Control
        value: public, max-age=86400
  - pattern: /favicon.svg
    headers:
      - key: Cache-Control
        value: public, max-age=86400
  # Astro fingerprints files under /_astro; only those can safely be immutable.
  - pattern: '/_astro/*'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable

