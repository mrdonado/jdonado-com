<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Simple Cover Builder</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="frame" data-ready="false">
      <div class="podcast-badge" aria-label="Podcast label">
        <svg class="badge-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3a4 4 0 0 0-4 4v5a4 4 0 1 0 8 0V7a4 4 0 0 0-4-4zm-6 9a1 1 0 1 1 2 0 4 4 0 1 0 8 0 1 1 0 1 1 2 0 6 6 0 0 1-5 5.9V22h2a1 1 0 1 1 0 2H9a1 1 0 1 1 0-2h2v-3.1A6 6 0 0 1 6 12z" />
        </svg>
        <span class="badge-text">PODCAST</span>
      </div>

      <section class="hero-shell" aria-hidden="true">
        <img class="hero-image" data-hero-image alt="" />
        <div class="hero-fade"></div>
      </section>

      <section class="title-zone">
        <h1 class="headline" data-title>Thinking Like an Engineer</h1>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
