<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Cover Builder</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="frame" data-ready="false">
      <div class="mesh mesh-a"></div>
      <div class="mesh mesh-b"></div>
      <div class="mesh mesh-c"></div>
      <div class="glow glow-a"></div>
      <div class="glow glow-b"></div>
      <div class="grain"></div>

      <section class="copy">
        <p class="kicker" data-kicker>Engineering Notes</p>
        <h1 class="headline" data-headline>Thinking Like an Engineer</h1>
        <p class="subtitle" data-subtitle>
          Avoiding the traps that show up when systems get complex.
        </p>
      </section>

      <aside class="social-panel" aria-label="Social links">
        <div class="social-row">
          <span class="badge" aria-label="Website">
            <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm7.9 9H16a16 16 0 0 0-1.2-5A8.1 8.1 0 0 1 19.9 11zM12 4.1c-.9 1.2-1.9 3.5-2.1 6.9h4.2c-.2-3.4-1.2-5.7-2.1-6.9zm-4.8 1.9A16 16 0 0 0 6 11H2.1a8.1 8.1 0 0 1 5.1-5zM2.1 13H6c.1 2 .6 3.8 1.2 5A8.1 8.1 0 0 1 2.1 13zm7.8 0c.2 3.4 1.2 5.7 2.1 6.9.9-1.2 1.9-3.5 2.1-6.9H9.9zm4.9 5a16 16 0 0 0 1.2-5h3.9a8.1 8.1 0 0 1-5.1 5z" />
            </svg>
          </span>
          <span class="handle">www.jdonado.com</span>
        </div>

        <div class="social-row">
          <span class="badge" aria-label="Instagram">
            <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7.8 2h8.4C19.4 2 22 4.6 22 7.8v8.4c0 3.2-2.6 5.8-5.8 5.8H7.8C4.6 22 2 19.4 2 16.2V7.8C2 4.6 4.6 2 7.8 2zm0 1.9A3.9 3.9 0 0 0 3.9 7.8v8.4A3.9 3.9 0 0 0 7.8 20h8.4a3.9 3.9 0 0 0 3.9-3.8V7.8A3.9 3.9 0 0 0 16.2 4H7.8zm8.8 1.5a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 1.9a3.1 3.1 0 1 0 0 6.2 3.1 3.1 0 0 0 0-6.2z" />
            </svg>
          </span>
          <span class="handle">@jdonadolens</span>
        </div>
        <div class="social-row">
          <span class="badge" aria-label="X">
            <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 3h4.2l4.6 6.4L18.1 3H20l-6.1 7.2L21 21h-4.2l-5-6.9L5.8 21H4l6.6-7.8z" />
            </svg>
          </span>
          <span class="handle">@jdonado</span>
        </div>
        <div class="social-row">
          <span class="badge" aria-label="YouTube">
            <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M22 12c0 2.5-.3 4.4-.7 5.4a3 3 0 0 1-2.1 2.1c-1 .3-4.4.5-7.2.5s-6.2-.2-7.2-.5a3 3 0 0 1-2.1-2.1C2.3 16.4 2 14.5 2 12s.3-4.4.7-5.4a3 3 0 0 1 2.1-2.1C5.8 4.2 9.2 4 12 4s6.2.2 7.2.5a3 3 0 0 1 2.1 2.1c.4 1 .7 2.9.7 5.4zm-12.5-3.5v7L16 12l-6.5-3.5z" />
            </svg>
          </span>
          <span class="handle">@mrdonado</span>
        </div>
        <div class="social-row">
          <span class="badge" aria-label="TikTok">
            <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14.9 3c.4 1.8 1.5 3.1 3.1 3.8.6.3 1.3.4 2 .4V10c-1 0-2-.2-2.9-.6V15a6 6 0 1 1-6-6h.1v2.8h-.1a3.2 3.2 0 1 0 3.2 3.2V3h2.6z" />
            </svg>
          </span>
          <span class="handle">@javierdonado</span>
        </div>

      </aside>

      <section class="visual-panel" aria-hidden="true">
        <div class="visual-sheen"></div>
        <div class="visual-caption">ARTICLE COVER</div>
        <img class="hero-image" data-hero-image alt="" />
        <div class="hero-vignette"></div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
